name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq openjdk-17-jdk 2>/dev/null
        java -version
    
    - name: Download Android SDK
      run: |
        mkdir -p android-sdk
        cd android-sdk
        curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        echo "sdk.dir=$PWD" > local.properties
    
    - name: Setup Android SDK
      env:
        ANDROID_HOME: ${{ github.workspace }}/android-sdk
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
    
    - name: Build with Gradle
      env:
        ANDROID_HOME: ${{ github.workspace }}/android-sdk
        GRADLE_OPTS: -Dorg.gradle.daemon=false
      run: |
        ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -100
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: LABMITM
        path: app/build/outputs/apk/debug/app-debug.apk
