name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq openjdk-17-jdk 2>/dev/null
    
    - name: Download Android SDK
      run: |
        mkdir -p android-sdk
        cd android-sdk
        curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
    
    - name: Setup Android SDK
      run: |
        export ANDROID_HOME=${{ github.workspace }}/android-sdk
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
    
    - name: Build APK
      env:
        ANDROID_HOME: ${{ github.workspace }}/android-sdk
      run: |
        export ANDROID_HOME=${{ github.workspace }}/android-sdk
        echo "android.dir=$ANDROID_HOME" > local.properties
        ./gradlew assembleDebug --no-daemon 2>&1
        echo "=== Build Output ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "APK not found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: LABMITM
        path: app/build/outputs/apk/debug/app-debug.apk
