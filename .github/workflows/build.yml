name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build Debug APK
      run: |
        cd $GITHUB_WORKSPACE
        aapt package -f -M AndroidManifest.xml -S res/ -I $ANDROID_HOME/platforms/android-29/android.jar -F build/resources.ap_
        javac -source 8 -target 8 -cp $ANDROID_HOME/platforms/android-29/android.jar -d build/classes build/gen/com/lab/mitm/R.java src/com/lab/mitm/*.java
        cd build/classes
        jar cf ../app.jar com/
        cd ..
        $ANDROID_HOME/build-tools/34.0.0/d8 app.jar --output ./
        mv classes.dex resources.ap_ LABMITM.apk
        mkdir -p dist
        mv LABMITM.apk dist/
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LABMITM
        path: dist/LABMITM.apk
    
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: dist/LABMITM.apk
