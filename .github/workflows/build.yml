name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - uses: android-actions/setup-android@v3
    
    - name: Build APK
      run: |
        mkdir -p build/gen/com/lab/mitm
        cat > build/gen/com/lab/mitm/R.java << 'EOF'
package com.lab.mitm;
public final class R {
    public static final class id {
        public static final int tvStatus = 0x7f0a0000;
        public static final int tvWifiName = 0x7f0a0001;
        public static final int tvIP = 0x7f0a0002;
        public static final int tvGateway = 0x7f0a0003;
        public static final int tvLog = 0x7f0a0004;
        public static final int btnScan = 0x7f0a0005;
        public static final int btnTraffic = 0x7f0a0006;
        public static final int btnProxy = 0x7f0a0007;
        public static final int btnVPN = 0x7f0a0008;
        public static final int btnADB = 0x7f0a0009;
        public static final int btnSettings = 0x7f0a000a;
        public static final int lvDevices = 0x7f0a000b;
        public static final int btnBack = 0x7f0a000c;
    }
    public static final class layout {
        public static final int activity_main = 0x7f0b0000;
        public static final int activity_scan = 0x7f0b0001;
    }
}
EOF
        aapt package -f -M AndroidManifest.xml -S res/ -I $ANDROID_HOME/platforms/android-29/android.jar -F build/resources.ap_
        javac -source 8 -target 8 -cp $ANDROID_HOME/platforms/android-29/android.jar -d build/gen build/gen/com/lab/mitm/R.java
        mkdir -p build/classes
        javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-29/android.jar:build/gen" -d build/classes src/com/lab/mitm/*.java
        cd build/classes && jar cf ../app.jar com/ && cd ..
        $ANDROID_HOME/build-tools/34.0.0/d8 app.jar --output ./
        mkdir -p dist
        cat resources.ap_ classes.dex > dist/LABMITM.apk
    
    - uses: actions/upload-artifact@v4
      with:
        name: LABMITM
        path: dist/LABMITM.apk
